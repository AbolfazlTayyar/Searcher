services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: searcher-elasticsearch
    environment:
      # Single-node dev cluster: no peer discovery, no other nodes to form a quorum with.
      - discovery.type=single-node
      # Security (TLS + auth) is disabled for local dev convenience only.
      # PRODUCTION: never disable this. Enable xpack.security.enabled (the 8.x default),
      # set ELASTIC_PASSWORD (or use the auto-generated bootstrap password), configure
      # TLS for the transport and HTTP layers, and put ES behind a network boundary
      # (VPC/firewall) rather than exposing 9200 directly.
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # Dev-friendly heap size. PRODUCTION: size this explicitly to ~50% of available
      # RAM (not more than ~31-32GB to stay under compressed-oops), and pin request/limit
      # memory in whatever orchestrator you deploy with so the JVM heap isn't guessing.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # PRODUCTION: a single node is a single point of failure. Run a multi-node
      # cluster (3+ master-eligible nodes) with dedicated data/master roles, and set
      # discovery.seed_hosts / cluster.initial_master_nodes accordingly instead of
      # discovery.type=single-node.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      # Named volume so indexed data survives container restarts/recreation.
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest:
    build:
      context: ./backend
    container_name: searcher-ingest
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX_NAME=linkedin_profiles
    volumes:
      - ./data:/app/data:ro
    command: ["python", "-m", "searcher.ingest.ingest"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: searcher-backend
    environment:
      # Service name, not localhost -- containers reach each other over the
      # compose network by service name.
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX_NAME=linkedin_profiles
      - CORS_ORIGINS=["http://localhost:4173"]
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-reachable URL: the browser talks to the backend via its
        # published host port, not the compose-internal service name.
        VITE_API_BASE_URL: http://localhost:8000
    container_name: searcher-frontend
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  es_data:
    driver: local
